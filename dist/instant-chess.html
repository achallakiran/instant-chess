<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instant Chess</title>
<style>
  :root {
    --bg: #14110f; --panel: #1f1a17; --panel2: #29221e; --ink: #f1e8dc; --muted: #a39482;
    --accent: #e0a64a; --accent2: #c0562f; --light: #e8d3ad; --dark: #a9794f;
    --sel: #f4d35e; --last: rgba(244, 211, 94, .45); --ok: #6fbf73; --bad: #e0553b;
    --board: min(94vw, 62vh, 600px);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: radial-gradient(circle at 30% 10%, #2a2018, var(--bg) 60%); color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; min-height: 100vh; }
  header { text-align: center; padding: 14px 12px 4px; }
  h1 { margin: 0; font-size: 26px; letter-spacing: .5px; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); font-size: 13px; }
  main { display: flex; flex-wrap: wrap; gap: 18px; justify-content: center; align-items: flex-start; padding: 12px; }
  #boardWrap { position: relative; }
  #board { width: var(--board); height: var(--board); display: grid; grid-template: repeat(8, 1fr) / repeat(8, 1fr);
    border: 8px solid #4a3426; border-radius: 6px; box-shadow: 0 18px 40px rgba(0,0,0,.55), inset 0 0 0 1px #00000055; user-select: none; }
  .sq { position: relative; display: flex; align-items: center; justify-content: center; cursor: default; }
  .sq.l { background: var(--light); } .sq.d { background: var(--dark); }
  .sq.last::before { content: ""; position: absolute; inset: 0; background: var(--last); }
  .sq.sel::before { content: ""; position: absolute; inset: 0; background: var(--sel); opacity: .75; }
  .sq.chk::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle, rgba(224,85,59,.95), rgba(224,85,59,0) 72%); }
  .sq.mine { cursor: pointer; }
  .sq.tgt { cursor: pointer; }
  .sq.tgt::after { content: ""; position: absolute; width: 28%; height: 28%; border-radius: 50%; background: rgba(30,20,10,.38); }
  .sq.tgt.cap::after { width: 86%; height: 86%; background: transparent; border: 5px solid rgba(192,86,47,.7); }
  .pc { position: relative; z-index: 1; font-size: calc(var(--board) / 8 * .8); line-height: 1; transition: transform .12s; }
  .pc.w { color: #fffaf0; -webkit-text-stroke: 1.2px #2b1d12; text-shadow: 0 2px 3px rgba(0,0,0,.45); }
  .pc.b { color: #2a211b; -webkit-text-stroke: 1px #0b0805; text-shadow: 0 2px 3px rgba(0,0,0,.35); }
  .sq.mine:hover .pc { transform: translateY(-3px) scale(1.06); }
  .sq.used .pc { opacity: .72; }
  .coord { position: absolute; font-size: 10px; font-weight: 600; opacity: .65; z-index: 0; }
  .coord.f { right: 3px; bottom: 1px; } .coord.r { left: 3px; top: 1px; }
  .sq.l .coord { color: var(--dark); } .sq.d .coord { color: var(--light); }
  aside { width: min(94vw, 380px); display: flex; flex-direction: column; gap: 12px; }
  .card { background: var(--panel); border: 1px solid #3a2f28; border-radius: 12px; padding: 14px; box-shadow: 0 6px 18px rgba(0,0,0,.35); }
  .card h2 { margin: 0 0 8px; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: var(--accent); }
  label.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 8px 0; }
  select, input[type=range] { background: var(--panel2); color: var(--ink); border: 1px solid #4a3d33; border-radius: 8px; padding: 6px 8px; }
  input[type=range] { padding: 0; width: 150px; accent-color: var(--accent); }
  input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); }
  .hint { color: var(--muted); font-size: 12px; margin: 2px 0 6px; }
  button { background: linear-gradient(#e8b457, #c98a2b); color: #25170a; border: 0; border-radius: 9px; padding: 10px 16px;
    font-weight: 700; font-size: 15px; cursor: pointer; box-shadow: 0 3px 0 #8a5a14; }
  button:active { transform: translateY(2px); box-shadow: 0 1px 0 #8a5a14; }
  button.ghost { background: var(--panel2); color: var(--ink); box-shadow: none; border: 1px solid #4a3d33; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  #status { font-size: 16px; font-weight: 600; }
  #status .dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 8px; border: 1px solid #000; vertical-align: -1px; }
  .meter { height: 8px; background: var(--panel2); border-radius: 6px; overflow: hidden; margin-top: 8px; }
  .meter > i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .2s; }
  #log { max-height: 240px; overflow: auto; font-size: 13px; }
  #log div { padding: 5px 0; border-bottom: 1px solid #332a24; }
  #log b { color: var(--accent); } #log .you b { color: #8fd694; }
  #banner { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; z-index: 5;
    background: rgba(10,7,5,.62); border-radius: 6px; text-align: center; padding: 20px; }
  #banner.show { display: flex; }
  #banner .box { background: var(--panel); border: 2px solid var(--accent); border-radius: 14px; padding: 22px 26px; }
  #banner h3 { margin: 0 0 6px; font-size: 24px; }
  #toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: #000d; padding: 8px 14px; border-radius: 8px; display: none; z-index: 9; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>Instant <span>Chess</span></h1>
  <div class="sub">Move one piece, and the rest of your army moves with it.</div>
</header>
<main>
  <div id="boardWrap">
    <div id="board"></div>
    <div id="banner"><div class="box"><h3 id="bannerTitle"></h3><div id="bannerText" class="sub"></div>
      <div class="btns" style="justify-content:center"><button id="again">New game</button></div></div></div>
  </div>
  <aside>
    <div class="card" id="setup">
      <h2>Game setup</h2>
      <label class="row">Win rule
        <select id="winRule"><option value="kingCapture">King capture</option><option value="checkmate">Checkmate</option></select></label>
      <div class="hint" id="winHint"></div>
      <label class="row">Castling <input type="checkbox" id="castling" checked></label>
      <label class="row">Pieces moving per turn (N) <span><b id="nVal">1</b></span></label>
      <input type="range" id="n" min="1" max="16" value="1" style="width:100%">
      <label class="row">Auto-move my other pieces <input type="checkbox" id="autoMove"></label>
      <div class="hint">On: you play one piece, the algorithm moves the rest up to N. Off: you choose every move.</div>
      <label class="row">Cap the first turn to 1 move <input type="checkbox" id="firstCap" checked></label>
      <label class="row">AI difficulty
        <select id="difficulty"><option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option></select></label>
      <label class="row">I play
        <select id="colour"><option value="w">White</option><option value="b">Black</option><option value="r">Random</option></select></label>
      <div class="btns"><button id="start">Start game</button></div>
    </div>
    <div class="card hidden" id="play">
      <h2>Turn</h2>
      <div id="status"></div>
      <div class="meter"><i id="meter" style="width:0"></i></div>
      <div class="hint" id="rules"></div>
      <div class="btns"><button id="endTurn" class="ghost">End my turn</button><button id="newGame" class="ghost">New game</button></div>
    </div>
    <div class="card hidden" id="logCard"><h2>Turn log</h2><div id="log"></div></div>
  </aside>
</main>
<div id="toast"></div>
